<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de Tiradas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: una sola columna tipo app movil. Saldo arriba, multiplicadores, boton grande de registro, desglose e historial. */
  :root {
    --bg: #eef3f8;
    --surface: #ffffff;
    --surface-2: #e3ebf3;
    --fg: #14202e;
    --muted: #5b6b7d;
    --line: #d3dde8;
    --accent: #e0431f;
    --on-accent: #ffffff;
    --gold: #f2b705;
    --on-gold: #2a1d00;
    --good: #1c8a4b;
    --font-display: 'Lilita One', 'Trebuchet MS', system-ui, sans-serif;
    --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a26; --surface: #172636; --surface-2: #213549; --fg: #eaf1f8; --muted: #93a4b6;
      --line: #2a3f55; --accent: #ff6b3d; --on-accent: #1a0900; --gold: #ffc933; --on-gold: #2a1d00; --good: #4cd08a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a26; --surface: #172636; --surface-2: #213549; --fg: #eaf1f8; --muted: #93a4b6;
    --line: #2a3f55; --accent: #ff6b3d; --on-accent: #1a0900; --gold: #ffc933; --on-gold: #2a1d00; --good: #4cd08a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
  h1 { font-size: 30px; line-height: 1.1; }
  h2 { font-size: 20px; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* Resumen */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--surface-2); border-radius: 10px; padding: 10px 8px; text-align: center; min-width: 0; }
  .stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; overflow-wrap: anywhere; }
  .stat span { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat.rest b.low { color: var(--accent); }
  .balance { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .balance label { display: flex; flex-direction: column; gap: 4px; flex: 1 1 160px; font-size: 13px; font-weight: 700; color: var(--muted); }
  input[type="number"] {
    font: inherit; font-size: 18px; font-weight: 800; color: var(--fg); background: var(--bg);
    border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0;
  }

  /* Multiplicadores */
  .mults { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip {
    background: var(--surface-2); color: var(--fg); border: 2px solid transparent; border-radius: 10px;
    padding: 12px 0; font-family: var(--font-display); font-size: 20px; min-width: 0;
  }
  .chip[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--on-gold); }
  .custom { display: flex; gap: 8px; }
  .btn-ghost { background: transparent; color: var(--fg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 14px; font-weight: 800; white-space: nowrap; }
  .btn-ghost:hover { border-color: var(--muted); }
  .btn-danger { color: var(--accent); border-color: var(--accent); }

  /* Boton de registro */
  .go {
    width: 100%; border: 0; border-radius: 16px; padding: 18px 12px;
    background: var(--accent); color: var(--on-accent);
    font-family: var(--font-display); font-size: 30px; letter-spacing: 0.02em;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25);
    transition: transform 80ms ease, box-shadow 80ms ease;
  }
  .go small { display: block; font-family: var(--font-body); font-size: 14px; font-weight: 700; opacity: 0.9; letter-spacing: 0; }
  .go:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }

  /* Desglose */
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .bar .m { font-family: var(--font-display); font-size: 18px; }
  .track { background: var(--surface-2); border-radius: 6px; height: 14px; overflow: hidden; }
  .fill { background: var(--gold); height: 100%; border-radius: 6px; }
  .bar .v { color: var(--muted); font-weight: 700; text-align: right; white-space: nowrap; }

  /* Historial */
  .hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .hist li { display: grid; grid-template-columns: 38px 56px 1fr auto auto; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hist li:first-child { border-top: 0; }
  .hist .n { color: var(--muted); font-weight: 700; }
  .hist .m { font-family: var(--font-display); font-size: 17px; }
  .hist .t { color: var(--muted); }
  .hist .cost { font-weight: 800; color: var(--accent); }
  .x { background: transparent; border: 0; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 8px; }
  .x:hover { color: var(--accent); }
  .empty { color: var(--muted); margin: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 160ms; max-width: 90vw; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .go, .toast { transition: none; } }
</style>
<style>html{color-scheme:light}body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Contador de Tiradas</h1>
    <p class="sub">Elige el multiplicador, toca Registrar y la cuenta se lleva sola.</p>
  </header>

  <section class="panel" aria-label="Resumen">
    <div class="stats">
      <div class="stat"><b class="num" id="sCount">0</b><span>Tiros</span></div>
      <div class="stat"><b class="num" id="sSpent">0</b><span>Tiradas usadas</span></div>
      <div class="stat rest"><b class="num" id="sRest">—</b><span>Te quedan</span></div>
    </div>
    <div class="balance">
      <label for="balance">Tiradas que tengo al empezar
        <input type="number" id="balance" inputmode="numeric" min="0" placeholder="Ej. 21270">
      </label>
    </div>
  </section>

  <section class="panel" aria-label="Registrar tirada">
    <h2>Multiplicador de apuesta</h2>
    <div class="mults" id="mults"></div>
    <div class="custom">
      <input type="number" id="customM" inputmode="numeric" min="1" placeholder="Otro multiplicador (ej. 1500)" aria-label="Otro multiplicador">
      <button class="btn-ghost" id="addCustom" type="button">Agregar</button>
    </div>
    <button class="go" id="go" type="button">REGISTRAR TIRO <small id="goSub">x1 · gasta 1 tirada</small></button>
    <div class="row2">
      <button class="btn-ghost" id="undo" type="button">Deshacer último</button>
      <button class="btn-ghost" id="copy" type="button">Copiar resumen</button>
    </div>
  </section>

  <section class="panel" aria-label="Desglose por multiplicador">
    <h2>Por multiplicador</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section class="panel" aria-label="Historial">
    <h2>Historial</h2>
    <ul class="hist" id="hist"></ul>
    <button class="btn-ghost btn-danger" id="reset" type="button">Borrar todo y empezar de cero</button>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var KEY = 'contador-tiradas-v1';
  var BASE = [1, 2, 3, 5, 10, 15, 20, 30, 50, 100, 200, 400];
  var state = load();
  var resetArmed = false;
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Number(n).toLocaleString('es'); };

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.log)) return { balance: s.balance == null ? null : s.balance, log: s.log, custom: s.custom || [], sel: s.sel || 1 };
    } catch (e) {}
    return { balance: null, log: [], custom: [], sel: 1 };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function allMults() {
    var set = {};
    BASE.concat(state.custom).forEach(function (m) { set[m] = 1; });
    return Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
  }
  function spent() { return state.log.reduce(function (a, e) { return a + e.m; }, 0); }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('show'); }, 1400);
  }
  function hhmm(ts) {
    var d = new Date(ts);
    return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', hour12: false });
  }

  function render() {
    var total = spent();
    $('sCount').textContent = fmt(state.log.length);
    $('sSpent').textContent = fmt(total);
    var rest = $('sRest');
    if (state.balance == null) { rest.textContent = '—'; rest.classList.remove('low'); }
    else {
      var left = state.balance - total;
      rest.textContent = fmt(left);
      rest.classList.toggle('low', left < 0);
    }

    var mults = allMults();
    $('mults').innerHTML = mults.map(function (m) {
      return '<button type="button" class="chip" data-m="' + m + '" aria-pressed="' + (m === state.sel) + '">x' + fmt(m) + '</button>';
    }).join('');
    $('goSub').textContent = 'x' + fmt(state.sel) + ' · gasta ' + fmt(state.sel) + (state.sel === 1 ? ' tirada' : ' tiradas');

    var by = {};
    state.log.forEach(function (e) { by[e.m] = by[e.m] || { c: 0, s: 0 }; by[e.m].c++; by[e.m].s += e.m; });
    var keys = Object.keys(by).map(Number).sort(function (a, b) { return a - b; });
    var maxC = keys.reduce(function (a, k) { return Math.max(a, by[k].c); }, 1);
    $('bars').innerHTML = keys.length ? keys.map(function (k) {
      return '<div class="bar"><span class="m">x' + fmt(k) + '</span><div class="track"><div class="fill" style="width:' + Math.round(by[k].c / maxC * 100) + '%"></div></div><span class="v num">' + fmt(by[k].c) + ' tiros · ' + fmt(by[k].s) + '</span></div>';
    }).join('') : '<p class="empty">Aún no hay tiros. Cuando registres el primero verás aquí cuántos hiciste con cada multiplicador.</p>';

    var recent = state.log.slice(-60).reverse();
    var startN = state.log.length;
    $('hist').innerHTML = recent.length ? recent.map(function (e, i) {
      var idx = state.log.length - 1 - i;
      return '<li><span class="n num">#' + (startN - i) + '</span><span class="m">x' + fmt(e.m) + '</span><span class="t">' + hhmm(e.t) + '</span><span class="cost num">−' + fmt(e.m) + '</span><button class="x" type="button" data-del="' + idx + '" aria-label="Quitar este tiro">×</button></li>';
    }).join('') : '<li><p class="empty">Todavía no hay tiros registrados.</p></li>';

    $('reset').textContent = resetArmed ? 'Toca otra vez para confirmar el borrado' : 'Borrar todo y empezar de cero';
    $('balance').value = state.balance == null ? '' : state.balance;
  }

  $('mults').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chip'); if (!b) return;
    state.sel = Number(b.dataset.m); save(); render();
  });
  $('go').addEventListener('click', function () {
    state.log.push({ m: state.sel, t: Date.now() }); save(); render();
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
  });
  $('undo').addEventListener('click', function () {
    if (!state.log.length) { toast('No hay nada que deshacer'); return; }
    var e = state.log.pop(); save(); render(); toast('Quitado x' + fmt(e.m));
  });
  $('hist').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-del]'); if (!b) return;
    state.log.splice(Number(b.dataset.del), 1); save(); render();
  });
  $('addCustom').addEventListener('click', function () {
    var v = parseInt($('customM').value, 10);
    if (!v || v < 1) { toast('Escribe un número mayor que 0'); return; }
    if (BASE.indexOf(v) < 0 && state.custom.indexOf(v) < 0) state.custom.push(v);
    state.sel = v; $('customM').value = ''; save(); render();
  });
  $('balance').addEventListener('input', function () {
    var v = $('balance').value;
    state.balance = v === '' ? null : Math.max(0, parseInt(v, 10) || 0); save();
    var total = spent(), rest = $('sRest');
    if (state.balance == null) { rest.textContent = '—'; rest.classList.remove('low'); }
    else { var left = state.balance - total; rest.textContent = fmt(left); rest.classList.toggle('low', left < 0); }
  });
  $('copy').addEventListener('click', function () {
    var by = {};
    state.log.forEach(function (e) { by[e.m] = (by[e.m] || 0) + 1; });
    var lines = Object.keys(by).map(Number).sort(function (a, b) { return a - b; }).map(function (k) { return 'x' + k + ': ' + by[k] + ' tiros (' + (by[k] * k) + ' tiradas)'; });
    var txt = 'Tiros: ' + state.log.length + '\nTiradas usadas: ' + spent() + (state.balance == null ? '' : '\nTe quedan: ' + (state.balance - spent())) + '\n' + lines.join('\n');
    try {
      navigator.clipboard.writeText(txt).then(function () { toast('Resumen copiado'); }, function () { toast('No se pudo copiar'); });
    } catch (e) { toast('No se pudo copiar'); }
  });
  $('reset').addEventListener('click', function () {
    if (!resetArmed) { resetArmed = true; render(); setTimeout(function () { resetArmed = false; render(); }, 4000); return; }
    state.log = []; resetArmed = false; save(); render(); toast('Contador en cero');
  });

  render();
})();
</script>

</body>
</html>
